name: quality-check

on:
  push:
  pull_request:

jobs:
  syntax-and-secret-patterns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python
        run: python -m compileall scripts
      - name: Reject personal path patterns
        run: |
          ! grep -RInE 'H:\\guser' . \
            --exclude-dir=.git \
            --exclude='*.png' \
            --exclude='*.svg'
